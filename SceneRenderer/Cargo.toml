[package]
name = "scene_renderer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lean Metal renderer for Wallpaper Engine scene packages"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
block2 = "0.6.2"
naga = { version = "29.0.3", features = ["glsl-in", "msl-out"] }
serde_json = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
uniffi = "0.28.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
