name: release

# Builds the app, packs a DMG and, for a version tag, attaches it (with its SHA-256) to a GitHub Release.
#   git tag v1.2.3 && git push origin v1.2.3        -> release
#   Actions > release > Run workflow                  -> dry run: same build, the DMG is only uploaded as an artifact
# The app is signed ad hoc and NOT notarized (no Apple Developer account); README.md explains the first launch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version written into the Info.plists for a dry run (digits and dots)'
        default: '0.0.0'
        required: true
      universal:
        description: 'Build arm64 + x86_64 (not supported yet: the renderer is arm64-only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dmg:
    # Apple silicon runner: Homebrew lives in /opt/homebrew (Package.swift hardcodes it for linking) and the
    # Rust renderer is built for aarch64-apple-darwin only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::'$VERSION' is not a version (use digits and dots, tag like v1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # The scene renderer: WallpaperMachine's Rust core (RenderService/), built and bindgen'd for Swift.
      # It must come before `swift test` too, because SwiftPM builds every target of the package.
      - name: Install renderer dependencies
        run: scripts/install-render-deps.sh

      - name: Build the render service
        run: scripts/build-render-service.sh

      - name: Tests (Core and SceneFormat)
        run: swift test

      - name: Build and assemble the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL_INPUT: ${{ inputs.universal }}
        run: |
          # Tags and unset inputs build arm64 only: the renderer static library and every Homebrew dependency
          # it links are arm64, so a universal build cannot link the x86_64 slice. Revisit if that changes.
          if [[ "$UNIVERSAL_INPUT" == "true" ]]; then
            echo "::error::universal builds are not supported: the Rust renderer is arm64-only"
            exit 1
          fi
          export UNIVERSAL=0
          ./build.sh

      - name: Verify the bundle
        run: scripts/verify-bundle.sh build/LiveWallpaper.app "${{ steps.version.outputs.version }}"

      - name: Make the DMG
        run: scripts/make-dmg.sh build/LiveWallpaper.app "${{ steps.version.outputs.version }}"

      - name: Upload the DMG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper-${{ steps.version.outputs.version }}-dmg
          path: |
            dist/LiveWallpaper-${{ steps.version.outputs.version }}.dmg
            dist/LiveWallpaper-${{ steps.version.outputs.version }}.dmg.sha256
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > release-notes.md <<'NOTES'
          Ad-hoc signed, not notarized. On first launch macOS will say it cannot verify the app:
          open System Settings > Privacy & Security, scroll down and press "Open Anyway" once, or run
          `xattr -dr com.apple.quarantine /Applications/LiveWallpaper.app` in Terminal. Details are in the README.

          Apple silicon (arm64) only: the scene renderer is built for arm64.

          Verify the download with the `.sha256` file: `shasum -a 256 -c LiveWallpaper-__VERSION__.dmg.sha256`.

          Not affiliated with Valve or Wallpaper Engine. Steam downloads use Valve's own SteamCMD with your own account.
          NOTES
          sed -i '' "s/__VERSION__/$VERSION/g" release-notes.md
          FILES=("dist/LiveWallpaper-$VERSION.dmg" "dist/LiveWallpaper-$VERSION.dmg.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "LiveWallpaper $VERSION" \
              --notes-file release-notes.md --generate-notes
          fi
