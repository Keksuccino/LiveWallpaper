name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # One arm64 runner. macos-26 is required, not just preferred: the renderer's C++ uses std::jthread, which
    # only exists from libc++ 18 (ungated in 19). macos-14 ships Xcode 15.4/libc++ 16 and cannot compile it,
    # and those images are retired on 2026-11-02.
    name: build (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # The service links RenderBridge, so the Rust/C++ renderer has to exist before any Swift build,
      # including `swift test` (SwiftPM builds every target of the package).
      - name: Install renderer dependencies
        run: scripts/install-render-deps.sh

      - name: Build the render service
        run: scripts/build-render-service.sh

      - name: Swift build (release)
        run: swift build -c release

      - name: Tests (Core and SceneFormat)
        run: swift test

      - name: Package app bundle
        run: ./build.sh

      - name: Verify bundle layout (app + service)
        run: scripts/verify-bundle.sh build/LiveWallpaper.app

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/LiveWallpaper.app LiveWallpaper-macos-26.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper-macos-26
          path: LiveWallpaper-macos-26.zip
          if-no-files-found: error
