name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # One runner: the renderer is arm64-only (RenderService/rust-toolchain.toml targets aarch64-apple-darwin,
    # and the Homebrew libraries it links are arm64), so macos-latest (also arm64) would only build it twice.
    name: build (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # The service links RenderBridge, so the Rust/C++ renderer has to exist before any Swift build,
      # including `swift test` (SwiftPM builds every target of the package).
      - name: Install renderer dependencies
        run: scripts/install-render-deps.sh

      - name: Build the render service
        run: scripts/build-render-service.sh

      - name: Swift build (release)
        run: swift build -c release

      - name: Tests (Core and SceneFormat)
        run: swift test

      - name: Package app bundle
        run: ./build.sh

      - name: Verify bundle layout (app + service)
        run: scripts/verify-bundle.sh build/LiveWallpaper.app

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/LiveWallpaper.app LiveWallpaper-macos-14.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper-macos-14
          path: LiveWallpaper-macos-14.zip
          if-no-files-found: error
