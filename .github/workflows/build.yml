name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-renderer:
    name: scene renderer (rust)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Every later step builds for macOS 26 against the macOS 26 SDK (rustc, clang and SwiftPM read both variables).
      - name: Pin the macOS 26 SDK
        run: |
          source scripts/macos-sdk.sh
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"

      # Restore before installing the toolchain so a cached ~/.cargo/bin cannot overwrite a newer rustup.
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            SceneRenderer/target
          # scripts/macos-sdk.sh (the deployment target) is part of the key: cargo does not rebuild for a new one.
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('SceneRenderer/Cargo.lock', 'scripts/macos-sdk.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Ensure stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc --version
          cargo --version

      # The offline build/test/clippy steps need a warm registry; this fetch is the only online cargo step.
      - name: Fetch Rust dependencies
        working-directory: SceneRenderer
        run: cargo +stable fetch --locked

      - name: Build the scene renderer (offline)
        working-directory: SceneRenderer
        run: cargo +stable build --offline --release

      - name: Unit tests (offline)
        working-directory: SceneRenderer
        run: cargo +stable test --offline

      - name: Clippy (offline)
        working-directory: SceneRenderer
        run: cargo +stable clippy --offline --all-targets -- -D warnings

  build:
    # One arm64 runner with Xcode 26 and its macOS 26 SDK, which the app is built against.
    name: build (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Every later step builds for macOS 26 against the macOS 26 SDK (rustc, clang and SwiftPM read both variables).
      - name: Pin the macOS 26 SDK
        run: |
          source scripts/macos-sdk.sh
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Cache cargo registry and scene renderer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            SceneRenderer/target
          # scripts/macos-sdk.sh (the deployment target) is part of the key: build-scene-renderer.sh cleans a target/
          # built for another deployment target, and a cache under an unchanged key would never be saved again.
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('SceneRenderer/Cargo.lock', 'scripts/macos-sdk.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Ensure stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Fetch scene renderer dependencies
        working-directory: SceneRenderer
        run: cargo +stable fetch --locked

      # The service links the scene renderer (SceneBridge), so its static library has to exist before
      # any Swift build, including `swift test` (SwiftPM builds every target of the package).
      - name: Build the scene renderer (offline)
        run: OFFLINE=1 scripts/build-scene-renderer.sh

      - name: Swift build (release)
        run: scripts/macos-sdk.sh swift build -c release

      - name: Tests (Core and SceneFormat)
        run: scripts/macos-sdk.sh swift test

      - name: Package app bundle
        run: ./build.sh

      - name: Verify bundle layout (app + service)
        run: scripts/verify-bundle.sh build/WallpaperMage.app

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/WallpaperMage.app WallpaperMage-macos-26.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperMage-macos-26
          path: WallpaperMage-macos-26.zip
          if-no-files-found: error
